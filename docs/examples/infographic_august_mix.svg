<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-label="August category horizontal bars">
  <rect width="920" height="430" rx="20" fill="#f4efe6"/>
  <rect x="16" y="16" width="888" height="398" rx="14" fill="#fffdf8" stroke="#e4d9c8"/>
  <text x="40" y="52" fill="#1f1a14" font-size="22" font-family="Georgia, serif">August category mix</text>

  <text x="40" y="78" fill="#6e6558" font-size="14" font-family="Segoe UI, sans-serif">One row per category · hours and share of the month</text>
  <text x="40" y="120" fill="#1f1a14" font-size="15" font-family="Segoe UI, sans-serif">Study</text>
  <rect x="170" y="104" width="480" height="24" rx="8" fill="#2a6f6f"/>
  <text x="680" y="121" fill="#6e6558" font-size="14" font-family="Segoe UI, sans-serif">44.3h · ~18%</text>
  <text x="40" y="166" fill="#1f1a14" font-size="15" font-family="Segoe UI, sans-serif">Code / IDE</text>
  <rect x="170" y="150" width="456" height="24" rx="8" fill="#5b7c5a"/>
  <text x="680" y="167" fill="#6e6558" font-size="14" font-family="Segoe UI, sans-serif">42.1h · ~17%</text>
  <text x="40" y="212" fill="#1f1a14" font-size="15" font-family="Segoe UI, sans-serif">Coursework</text>
  <rect x="170" y="196" width="332" height="24" rx="8" fill="#6b4c7a"/>
  <text x="680" y="213" fill="#6e6558" font-size="14" font-family="Segoe UI, sans-serif">30.7h · ~13%</text>
  <text x="40" y="258" fill="#1f1a14" font-size="15" font-family="Segoe UI, sans-serif">Other web</text>
  <rect x="170" y="242" width="264" height="24" rx="8" fill="#c45c26"/>
  <text x="680" y="259" fill="#6e6558" font-size="14" font-family="Segoe UI, sans-serif">24.4h · ~10%</text>
  <text x="40" y="304" fill="#1f1a14" font-size="15" font-family="Segoe UI, sans-serif">Gaming</text>
  <rect x="170" y="288" width="229" height="24" rx="8" fill="#b08968"/>
  <text x="680" y="305" fill="#6e6558" font-size="14" font-family="Segoe UI, sans-serif">21.2h · ~9%</text>
  <text x="40" y="350" fill="#1f1a14" font-size="15" font-family="Segoe UI, sans-serif">AI / ML</text>
  <rect x="170" y="334" width="219" height="24" rx="8" fill="#6e6558"/>
  <text x="680" y="351" fill="#6e6558" font-size="14" font-family="Segoe UI, sans-serif">20.3h · ~8%</text>
  <text x="40" y="400" fill="#6e6558" font-size="12" font-family="Segoe UI, sans-serif">Percent = share of all tracked hours that month</text>

</svg>
