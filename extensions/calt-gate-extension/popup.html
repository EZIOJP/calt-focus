<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CALT Gate</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 12px; min-width: 260px; background: #0a0a0f; color: #e8e8f0; }
    h1 { font-size: 14px; margin: 0 0 4px; cursor: default; user-select: none; }
    .muted { color: #888; font-size: 11px; margin-bottom: 10px; line-height: 1.35; }
    button { width: 100%; padding: 8px; margin-top: 6px; border-radius: 6px; border: 1px solid #333; background: #1a1a24; color: #fff; cursor: pointer; }
    #status { font-size: 12px; margin-top: 8px; line-height: 1.4; }
    .warn { color: #fbbf24; }
    .inspect { color: #fbbf24; font-size: 11px; margin-top: 8px; line-height: 1.35; display: none; }
    .inspect.on { display: block; }
    #inspectToggle { display: none; background: #3b2a12; border-color: #d97706; }
    #inspectToggle.on { display: block; }
  </style>
</head>
<body>
  <h1 id="title">CALT Gate</h1>
  <p class="muted">Browser SoftLand · pairs with SelfTracker.<br/>OS app kills: <b>Focus → Enforcer</b>.<br/>Quinn ON/OFF: <b>Focus Home</b>. Redirects stay on.<br/>Reload this extension after updates (need v1.1.2+).</p>
  <div id="status">Loading…</div>
  <div id="v2status" class="muted" style="margin-top:8px"></div>
  <div id="thresh" class="muted" style="margin-top:6px;font-size:10px"></div>
  <div id="why" class="muted" style="margin-top:8px;max-height:180px;overflow:auto;font-size:10px;line-height:1.35;white-space:pre-wrap"></div>

  <div id="inspectHint" class="inspect">Inspect mode ON — overlays show score on non-porn pages. Porn / adult hosts still lock (DNR + SoftLand).</div>
  <button id="refresh">Refresh gate</button>
  <button id="whyBtn">Why? (last verdicts)</button>
  <button id="blocklistBtn">Refresh blocklist</button>
  <button id="inspectToggle">Turn Inspect off</button>
  <script src="popup.js"></script>
</body>
</html>
